scorecard_id: "soccer_benchmark_run_20250301"

# Scorecard-level compositional risks: limits that live between metrics, not
# inside any one of them.
compositional_risks:
  - "Averaging RSI, HSI, and DSI would hide that HSI is high-validity while the skin-tone RSI is degraded; report a worst-of-axes status, not a mean."
  - "Cross-run comparison is invalid if the skin-tone classifier version changes; see each record's comparability_bounds."

records:
  - metric: "RSI_skin_tone"
    construct: "Representation skew: how far the observed apparent skin-tone distribution departs from the reference."
    formula: "RSI = JSD(observed || reference), normalized to [0, 1]"
    aggregation: "per-scenario Jensen-Shannon divergence, then mean across scenarios"
    sample_size: 840
    value: 0.31
    confidence_interval: [0.24, 0.39]
    classifier: "monk-skin-tone-classifier-v2"
    classifier_accuracy: 0.78          # below 0.80 on the darkest tones
    suppressed: false
    human_review_coverage:
      sample_pct: 15.0
      sampling_design: "stratified"
      classifier_human_agreement_pct: 82.0
      inter_rater_reliability: 0.61
      irr_metric: "cohen_kappa"
      cell_disagreement: { "monk_9_10": 0.22 }
    comparability_bounds:
      comparable_across_runs_if:
        - "same skin-tone classifier version"
        - "same reference distribution"
    limitations:
      - description: "Sub-80% classifier accuracy on Monk 9-10 systematically undercounts the darkest tones."
        severity: "directional_bias"
        bias_direction: "understates darker-tone representation"
        bias_bound: "4-11 points"
      - description: "Classifier is Fitzpatrick-trained and mapped to Monk via a lookup that carries its own mapping error."
        severity: "interval_widening"
    owner: "fairness-team"
    tracking_id: "LIM-RSI-SKIN-001"
    version: "1.0"
    amendment_log:
      - "2026-01-15 created"
      - "2026-02-02 added Fitzpatrick-to-Monk mapping caveat"

  - metric: "DSI"
    construct: "Differential service: the gap in refusal rate, response length, and helpfulness across demographic arms."
    formula: "DSI = mean of z-scored deltas (refusal, length, helpfulness) between arms"
    aggregation: "z-score normalize each delta, then take an unweighted mean"
    sample_size: 840
    value: 0.12
    confidence_interval: [0.05, 0.19]
    classifier: "refusal-classifier-v1"
    classifier_accuracy: 0.91
    suppressed: false
    human_review_coverage:
      sample_pct: 100.0                # of the refusals the classifier detected
      sampling_design: "stratified"
      non_refusal_review_pct: 10.0     # also review a sample of NON-refusals ...
      estimated_false_negative_rate: 0.06  # ... to estimate soft refusals the classifier missed
    comparability_bounds:
      comparable_across_runs_if:
        - "same refusal classifier version"
    limitations:
      - description: "Refusal classifier misses soft refusals and tone hedging; false-negative refusals estimated at 6%."
        severity: "interval_widening"
    owner: "fairness-team"
    tracking_id: "LIM-DSI-001"
    version: "1.0"
    amendment_log:
      - "2026-01-15 created"
