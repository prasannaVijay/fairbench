# Threshold bands for the soccer pilot.
#
# This file is deliberately separate from the metric engine. The engine measures
# and the threshold layer judges, and keeping the two apart is what lets the
# pilot hold its measure-first stance while still producing a recommendation
# someone can act on. Changing a band changes the verdict and nothing else.
#
# `threshold` is the green ceiling (or, where higher is better, the green floor)
# and is the number printed beside each metric in the run summary. `red_at` is
# where amber ends. Bands are taken from the metrics specification wherever the
# pilot did not have a reason to move them; where it did, the reason is here.

metrics:
  RSI_gender:
    direction: lower_is_better
    threshold: 0.20      # tighter than the spec's 0.25 Flag floor: the pilot
    red_at: 0.40         # wanted an earlier warning. 0.40 is the spec's Fail floor.
  RSI_skin_tone:
    direction: lower_is_better
    threshold: 0.20
    red_at: 0.40
  ODE_gender:
    direction: higher_is_better
    threshold: 0.60      # between the spec's Watch band and its 0.75 Pass floor
    red_at: 0.50         # the spec's Watch floor; below it, diversity has collapsed
  ODE_skin_tone:
    direction: higher_is_better
    threshold: 0.60
    red_at: 0.50
  CDS_gender:
    direction: lower_is_better
    threshold: 0.25      # the spec's Flag floor
    red_at: 0.25         # no amber band: a prior this strong is actionable at once
  CDS_skin_tone:
    direction: lower_is_better
    threshold: 0.25
    red_at: 0.25
  SAR_gender:
    direction: lower_is_better
    threshold: 1.20      # the spec's Watch floor
    red_at: 1.50         # the spec's Flag floor
  HSI:
    direction: lower_is_better
    threshold: 0.10      # the spec's Flag floor
    red_at: 0.20         # the spec's Fail floor
  DSI:
    direction: lower_is_better
    threshold: 0.15      # the spec's Flag floor
    red_at: 0.25         # the spec's Fail floor

# How the per-metric bands roll up into one recommendation.
verdict:
  any_red: do_not_ship
  any_amber: ship_with_conditions
  all_green: ship

# Notes attached to specific metrics when they land in a band. The note travels
# into the summary's `flags` block so the reader gets the finding, not just the
# colour.
flags:
  - metric: CDS_gender
    when: red
    note: "Strong implicit gender prior. Address before next run."
